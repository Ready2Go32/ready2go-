<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ゴミ収集カレンダー — Ready2Go</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ゴミ収集カレンダー固有スタイル ── */
    .gc-container {
      max-width: 900px;
      margin: 0 auto;
      padding: calc(var(--topbar-h) + 20px) 16px 40px;
    }
    .gc-header-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .gc-title {
      font-size: 20px;
      font-weight: 700;
      flex: 1;
      min-width: 160px;
    }
    .gc-location-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .gc-location-bar label { font-size: 13px; color: var(--text-2); font-weight: 500; }
    .gc-location-bar select { min-width: 120px; }
    .gc-region-input {
      min-width: 210px;
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }
    .gc-location-help {
      flex-basis: 100%;
      margin: -4px 0 0 30px;
      color: var(--text-3);
      font-size: 11px;
    }
    .gc-sort-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:20px; }
    .gc-sort-box h2 { font-size:16px; margin-bottom:5px; }
    .gc-sort-box p { font-size:12px; color:var(--text-2); margin-bottom:12px; }
    .gc-sort-form { display:flex; gap:8px; }
    .gc-sort-form input { flex:1; min-width:0; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface2); color:var(--text); font-family:var(--font); }
    .gc-sort-result { margin-top:12px; font-size:14px; line-height:1.7; }
    .gc-sort-answer { padding:12px; border-radius:10px; background:var(--surface2); }
    .gc-bottom-nav { position:fixed; bottom:0; left:0; right:0; height:calc(64px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); display:flex; background:var(--surface); border-top:1px solid var(--border); z-index:900; }
    .gc-bottom-nav a { flex:1; min-height:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--text-3); text-decoration:none; font-size:10px; }
    .gc-bottom-nav a span { font-size:20px; }
    .gc-bottom-nav a.active { color:var(--accent); background:var(--accent-light); }
    .gc-search-btn {
      padding: 8px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .gc-search-btn:hover { opacity: .88; }
    .gc-gps-btn {
      padding: 8px 14px;
      background: var(--surface2);
      color: var(--text-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .gc-gps-btn:hover { background: var(--border); }

    /* AI分析結果エリア */
    .gc-ai-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      min-height: 80px;
    }
    .gc-ai-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-2);
      font-size: 14px;
    }
    .gc-spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .gc-schedule-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .gc-schedule-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .gc-schedule-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
    }
    .gc-schedule-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .gc-note {
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.6;
    }
    .gc-source-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      margin-top: 8px;
    }
    .gc-source-link:hover { text-decoration: underline; }

    /* 月カレンダー */
    .gc-month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }
    .gc-month-label {
      font-size: 18px;
      font-weight: 600;
      min-width: 140px;
      text-align: center;
    }
    .gc-month-btn {
      width: 36px; height: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      font-size: 20px;
      color: var(--text-2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      line-height: 1;
    }
    .gc-month-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    .gc-cal-grid {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .gc-cal-head {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .gc-cal-head-cell {
      text-align: center;
      padding: 10px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }
    .gc-cal-head-cell:first-child { color: var(--red); }
    .gc-cal-head-cell:last-child  { color: var(--blue); }

    .gc-cal-body {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .gc-cal-cell {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 6px 4px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .gc-cal-cell:nth-child(7n) { border-right: none; }
    .gc-cal-cell.gc-empty { background: var(--surface2); opacity: .4; }
    .gc-cal-cell.gc-today { background: var(--today-bg); }
    .gc-cal-cell.gc-today .gc-day-num { color: var(--today-ring); font-weight: 700; }

    .gc-day-num {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .gc-cal-cell.gc-sunday  .gc-day-num { color: var(--red); }
    .gc-cal-cell.gc-saturday .gc-day-num { color: var(--blue); }

    .gc-tag {
      font-size: 9px;
      color: white;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gc-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .gc-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-2);
    }
    .gc-legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
    }

    .gc-placeholder {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-3);
      font-size: 14px;
      line-height: 1.8;
    }
    .gc-placeholder-icon { font-size: 48px; margin-bottom: 12px; }

    @media (max-width: 600px) {
      .gc-location-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .gc-location-bar > label { display: none; }
      .gc-location-bar select, .gc-region-input { width: 100%; min-width: 0; }
      .gc-region-input, .gc-area-input, .gc-location-help { grid-column: 1 / -1; }
      .gc-location-help { margin: -2px 0 0; }
      .gc-search-btn, .gc-gps-btn { width: 100%; }
      .gc-cal-cell { min-height: 60px; padding: 4px 2px; }
      .gc-tag { font-size: 8px; }
      .gc-month-label { font-size: 15px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-link" style="text-decoration:none;display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px;">
      ‹ 戻る
    </a>
  </div>
  <div class="topbar-center" style="text-align:center;">
    <span style="font-size:16px;font-weight:700;color:var(--accent);">🗑 ゴミ収集カレンダー</span>
  </div>
  <div class="topbar-right" style="width:60px;"></div>
</header>

<div class="gc-container">

  <!-- 地域選択バー -->
  <div class="gc-location-bar">
    <label>📍</label>
    <select id="gc-pref" class="sel-pref"></select>
    <input id="gc-region" class="gc-region-input" list="gc-region-list" placeholder="市区町村を入力（例：新宿区）" autocomplete="address-level2">
    <datalist id="gc-region-list"></datalist>
    <input id="gc-area" class="gc-region-input gc-area-input" placeholder="町名・地区（任意、例：西新宿）" autocomplete="address-level3">
    <button id="gc-gps-btn" class="gc-gps-btn">📡 GPS</button>
    <button id="gc-search-btn" class="gc-search-btn">🔍 AIで調べる</button>
    <div class="gc-location-help">候補を選ぶか直接入力できます。地区で収集日が違う場合は町名・地区も入力してください</div>
  </div>

  <section class="gc-sort-box">
    <h2>これは何ごみ？</h2>
    <p>品目を入力すると、選択地域の自治体公式情報から分別方法を確認します。</p>
    <div class="gc-sort-form"><input id="gc-item" placeholder="例：乾電池、傘、スプレー缶"><button id="gc-sort-btn" class="gc-search-btn">調べる</button></div>
    <div id="gc-sort-result" class="gc-sort-result"></div>
  </section>

  <!-- AI分析結果 -->
  <div class="gc-ai-area" id="gc-ai-area">
    <div class="gc-placeholder">
      <div class="gc-placeholder-icon">🗑️</div>
      <div>地域を選択して「AIで調べる」を押すと<br>ゴミ収集スケジュールをAIが検索・整理します</div>
    </div>
  </div>

  <!-- 月カレンダー -->
  <div id="gc-calendar-section" style="display:none;">
    <div class="gc-month-nav">
      <button class="gc-month-btn" id="gc-prev-month">‹</button>
      <span class="gc-month-label" id="gc-month-label"></span>
      <button class="gc-month-btn" id="gc-next-month">›</button>
    </div>
    <div class="gc-cal-grid">
      <div class="gc-cal-head">
        <div class="gc-cal-head-cell">日</div>
        <div class="gc-cal-head-cell">月</div>
        <div class="gc-cal-head-cell">火</div>
        <div class="gc-cal-head-cell">水</div>
        <div class="gc-cal-head-cell">木</div>
        <div class="gc-cal-head-cell">金</div>
        <div class="gc-cal-head-cell">土</div>
      </div>
      <div class="gc-cal-body" id="gc-cal-body"></div>
    </div>
    <div class="gc-legend" id="gc-legend"></div>
  </div>

</div>

<nav class="gc-bottom-nav"><a href="index.html"><span>⌂</span>ホーム</a><a href="index.html#calendarSection"><span>▣</span>予定</a><a class="active" href="garbage-calendar.html"><span>♻️</span>ごみ</a><a href="index.html?open=settings"><span>⚙️</span>設定</a></nav>

<script src="app-config.js"></script>
<script src="storage.js"></script>
<script src="garbage.js"></script>
<script>
(async () => {
  const SERVER_URL = window.APP_CONFIG?.serverUrl || location.origin;
  // ── 設定の引き継ぎ ──
  const savedDark  = localStorage.getItem("darkMode") === "true";
  if (savedDark) document.documentElement.setAttribute("data-theme","dark");
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme)  document.documentElement.style.setProperty("--accent", savedTheme);
  const savedFs    = localStorage.getItem("fontSize");
  if (savedFs)     document.body.style.fontSize = savedFs + "px";

  await Storage.open().catch(() => {});

  // ── 都道府県リスト ──
  const prefSel   = document.getElementById("gc-pref");
  const regionSel = document.getElementById("gc-region");
  const areaInput = document.getElementById("gc-area");
  const regionList = document.getElementById("gc-region-list");
  Object.keys(Garbage.REGION_MAP).sort().forEach(p => {
    const o = document.createElement("option");
    o.value = p; o.textContent = p;
    prefSel.appendChild(o);
  });

  // URLパラメータから引き継ぎ
  const params = new URLSearchParams(location.search);
  const urlPref   = params.get("pref");
  const urlRegion = params.get("region");

  // ローカルストレージから引き継ぎ
  const lsPref = urlPref || localStorage.getItem("pref") || "東京都";
  prefSel.value = lsPref;
  updateRegionList(lsPref);

  if (urlRegion) {
    regionSel.value = urlRegion;
  } else {
    const lsRegion = localStorage.getItem("region_" + lsPref);
    if (lsRegion) regionSel.value = lsRegion;
  }
  areaInput.value = params.get("area") || localStorage.getItem("area_" + lsPref + "_" + regionSel.value) || "";

  prefSel.onchange = () => {
    regionSel.value = "";
    updateRegionList(prefSel.value);
    localStorage.setItem("pref", prefSel.value);
  };

  function updateRegionList(pref) {
    regionList.innerHTML = "";
    (Garbage.REGION_MAP[pref] || []).forEach(r => {
      const o = document.createElement("option");
      o.value = r;
      regionList.appendChild(o);
    });
  }
  regionSel.addEventListener("change", () => {
    const region = regionSel.value.trim();
    if (region) localStorage.setItem("region_" + prefSel.value, region);
  });
  areaInput.addEventListener("change", () => {
    if (regionSel.value.trim()) localStorage.setItem("area_" + prefSel.value + "_" + regionSel.value.trim(), areaInput.value.trim());
  });

  // ── GPS ──
  document.getElementById("gc-gps-btn").onclick = async () => {
    if (!navigator.geolocation) { alert("位置情報がサポートされていません"); return; }
    const btn = document.getElementById("gc-gps-btn");
    btn.textContent = "取得中…";
    btn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      async pos => {
        btn.textContent = "📡 GPS";
        btn.disabled = false;
        // 逆ジオコーディング（Nominatim）
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=ja`);
          const d = await r.json();
          const state = d.address?.state || "";
          if (state && prefSel.querySelector(`option[value="${state}"]`)) {
            prefSel.value = state;
            updateRegionList(state);
            const city = d.address?.city || d.address?.town || d.address?.county || "";
            if (city) {
              const candidates = Garbage.REGION_MAP[state] || [];
              const match = candidates.find(name => name.includes(city.replace(/市|区|町|村/g,"").slice(0,3)));
              regionSel.value = match || city;
              localStorage.setItem("region_" + state, regionSel.value);
            }
          }
        } catch(e) { console.warn("逆ジオコーディング失敗", e); }
      },
      () => { btn.textContent = "📡 GPS"; btn.disabled = false; alert("位置情報の取得に失敗しました"); }
    );
  };

  // ── AI検索 ──
  let currentSchedule = null;
  let displayMonth = new Date();
  displayMonth.setDate(1);

  document.getElementById("gc-search-btn").onclick = () => searchGarbage();

  // 地域が既に選択されていれば自動検索
  if (regionSel.value) searchGarbage();

  async function searchGarbage() {
    const pref   = prefSel.value;
    const region = regionSel.value.trim();
    const area = areaInput.value.trim();
    if (!pref || !region) {
      alert("都道府県と市区町村を選択してください");
      return;
    }
    localStorage.setItem("pref", pref);
    localStorage.setItem("region_" + pref, region);
    if (area) localStorage.setItem("area_" + pref + "_" + region, area);

    const aiArea = document.getElementById("gc-ai-area");
    aiArea.innerHTML = `<div class="gc-ai-loading"><div class="gc-spinner"></div>AIがゴミ収集スケジュールを検索中…</div>`;
    document.getElementById("gc-calendar-section").style.display = "none";

    try {
      const schedule = await fetchScheduleWithAI(pref, region, area);
      currentSchedule = schedule;
      renderAIResult(pref, region + (area ? ` ${area}` : ""), schedule);
      renderCalendar();
      document.getElementById("gc-calendar-section").style.display = "block";
    } catch(e) {
      aiArea.innerHTML = `<div style="color:var(--red);font-size:14px;">⚠️ 取得に失敗しました: ${e.message}</div>`;
    }
  }

  async function fetchScheduleWithAI(pref, region, area) {
    // まずローカルキャッシュを確認
    const cacheKey = `gc_ai_${pref}_${region}_${area || "all"}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (parsed._verifiedOfficial === true && parsed._ts
            && Date.now() - parsed._ts < 7 * 24 * 60 * 60 * 1000) {
          const weekly = Object.fromEntries(parsed.garbageTypes.map(g => [g.name, {
            color: g.color, icon: g.icon, days: g.days
          }]));
          weekly._verifiedOfficial = true;
          weekly._sourceUrl = parsed.sourceUrl;
          weekly._checkedAt = parsed.checkedAt;
          await Storage.saveGarbageSchedule(Garbage.makeKey(pref, region), weekly);
          return parsed;
        }
      } catch(e) {}
    }

    const idToken = Storage.getLineIdToken();
    if (!idToken) throw new Error("先にLINE連携ページからログインしてください");
    const res = await fetch(`${SERVER_URL}/api/garbage-schedule`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({ pref, region, area })
    });

    const schedule = await res.json();
    if (!res.ok) throw new Error(schedule.error || `API Error: ${res.status}`);
    if (schedule._verifiedOfficial !== true) {
      throw new Error("自治体公式情報を確認できなかったため表示しません");
    }
    schedule._ts = Date.now();
    localStorage.setItem(cacheKey, JSON.stringify(schedule));
    const weeklySchedule = Object.fromEntries(
      schedule.garbageTypes.map(g => [g.name, {
        color: g.color, icon: g.icon, days: g.days
      }])
    );
    weeklySchedule._verifiedOfficial = true;
    weeklySchedule._sourceUrl = schedule.sourceUrl;
    weeklySchedule._checkedAt = schedule.checkedAt;
    await Storage.saveGarbageSchedule(Garbage.makeKey(pref, region), weeklySchedule);
    return schedule;
  }

  document.getElementById("gc-sort-btn").onclick = async () => {
    const item = document.getElementById("gc-item").value.trim();
    const pref = prefSel.value, region = regionSel.value.trim(), area = areaInput.value.trim();
    const result = document.getElementById("gc-sort-result");
    if (!region || !item) { alert("市区町村と調べたい品目を入力してください"); return; }
    const idToken = Storage.getLineIdToken();
    if (!idToken) { result.textContent = "先にLINE連携ページからログインしてください。"; return; }
    result.innerHTML = '<div class="gc-ai-loading"><div class="gc-spinner"></div>自治体公式情報を確認中…</div>';
    try {
      const response = await fetch(`${SERVER_URL}/api/garbage-sort`, {
        method:"POST", headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${idToken}` },
        body:JSON.stringify({ pref, region, area, item })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "確認できませんでした");
      result.innerHTML = `<div class="gc-sort-answer"><b>${escapeText(item)} → ${escapeText(data.category)}</b><br>${escapeText(data.instructions)}<br><a href="${escapeUrl(data.sourceUrl)}" target="_blank" rel="noopener">自治体公式ページで確認</a></div>`;
    } catch(e) { result.textContent = `⚠️ ${e.message}`; }
  };

  function escapeText(value) { const d=document.createElement("div"); d.textContent=String(value || ""); return d.innerHTML; }
  function escapeUrl(value) { try { const u=new URL(value); return u.protocol === "https:" ? u.href : "#"; } catch { return "#"; } }

  function renderAIResult(pref, region, schedule) {
    const aiArea = document.getElementById("gc-ai-area");
    const conf = schedule.confidence === "high" ? "✅ 公式情報を取得" : "⚠️ 公式ページで要確認";

    let html = `<div class="gc-schedule-header">${pref}${region} のゴミ収集スケジュール <span style="font-size:11px;color:var(--text-3)">${conf}</span></div>`;
    html += `<div class="gc-schedule-grid">`;
    (schedule.garbageTypes || []).forEach(g => {
      html += `<div class="gc-schedule-item">
        <div class="gc-schedule-dot" style="background:${g.color}"></div>
        <span>${g.icon} <b>${g.name}</b> — ${g.schedule}</span>
      </div>`;
    });
    html += `</div>`;

    if (schedule.note) {
      html += `<div class="gc-note">📝 ${schedule.note}</div>`;
    }
    if (schedule.sourceUrl) {
      html += `<a href="${schedule.sourceUrl}" target="_blank" class="gc-source-link">🌐 自治体公式サイトで確認する</a>`;
    }

    aiArea.innerHTML = html;
  }

  // ── カレンダー描画 ──
  function renderCalendar() {
    if (!currentSchedule) return;
    const y = displayMonth.getFullYear();
    const m = displayMonth.getMonth();
    document.getElementById("gc-month-label").textContent =
      `${y}年${m + 1}月`;

    const body    = document.getElementById("gc-cal-body");
    const todayKey = new Date().toISOString().split("T")[0];
    const firstDay = new Date(y, m, 1).getDay();
    const lastDate = new Date(y, m + 1, 0).getDate();

    let html = "";
    // 空セル
    for (let i = 0; i < firstDay; i++) {
      html += `<div class="gc-cal-cell gc-empty"></div>`;
    }
    for (let d = 1; d <= lastDate; d++) {
      const date    = new Date(y, m, d);
      const dow     = date.getDay();
      const key     = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const isToday = key === todayKey;
      const weekOfMonth = Math.ceil(d / 7);

      let cls = "gc-cal-cell";
      if (isToday) cls += " gc-today";
      if (dow === 0) cls += " gc-sunday";
      if (dow === 6) cls += " gc-saturday";

      let tags = "";
      (currentSchedule.garbageTypes || []).forEach(g => {
        if (!g.days) return;
        for (const rule of g.days) {
          if (rule.dow === dow && (rule.week === null || rule.week === weekOfMonth)) {
            tags += `<div class="gc-tag" style="background:${g.color}">${g.icon} ${g.name}</div>`;
            break;
          }
        }
      });

      html += `<div class="${cls}">
        <div class="gc-day-num">${d}</div>
        ${tags}
      </div>`;
    }
    body.innerHTML = html;

    // 凡例
    const legend = document.getElementById("gc-legend");
    legend.innerHTML = (currentSchedule.garbageTypes || []).map(g =>
      `<div class="gc-legend-item">
        <div class="gc-legend-dot" style="background:${g.color}"></div>
        ${g.icon} ${g.name}
      </div>`
    ).join("");
  }

  // 月ナビ
  document.getElementById("gc-prev-month").onclick = () => {
    displayMonth.setMonth(displayMonth.getMonth() - 1);
    renderCalendar();
  };
  document.getElementById("gc-next-month").onclick = () => {
    displayMonth.setMonth(displayMonth.getMonth() + 1);
    renderCalendar();
  };
})();
</script>
</body>
</html>
