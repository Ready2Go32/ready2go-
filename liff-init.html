<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>LINE連携中…</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: #f0f4f8; color: #1e293b;
    }
    .box {
      background: white; border-radius: 16px;
      padding: 40px 32px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      max-width: 340px; width: 90%;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #64748b; line-height: 1.7; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #10b981; font-weight: 600; margin-top: 16px; }
    .error   { color: #ef4444; font-weight: 600; margin-top: 16px; }
    .line-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #06c755;
      color: white;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="box">
  <div class="icon">📘</div>
  <h2>Ready2Go</h2>
  <p>LINEアカウントと連携して<br>朝の通知を受け取ります</p>
  <div class="spinner" id="spinner"></div>
  <div id="msg"></div>
</div>

<!-- LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="app-config.js"></script>
<script>
(async () => {
  const LIFF_ID     = window.APP_CONFIG?.liffId || "";
  const SERVER_URL  = window.APP_CONFIG?.serverUrl || location.origin;
  const APP_URL     = "index.html";

  const msgEl     = document.getElementById("msg");
  const spinnerEl = document.getElementById("spinner");

  try {
    if (!LIFF_ID) throw new Error("サーバーにLIFF_IDが設定されていません");
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
      return;
    }

    const idToken = liff.getIDToken();
    if (!idToken) throw new Error("LINEのIDトークンを取得できませんでした");

    // サーバー側で署名・有効期限・チャネルIDを検証してから登録
    const registerRes = await fetch(`${SERVER_URL}/liff-init`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    if (!registerRes.ok) throw new Error("LINE認証を確認できませんでした");
    const registered = await registerRes.json();

    // IDトークンはタブを閉じると消えるsessionStorageだけに保存
    sessionStorage.setItem("lineIdToken", idToken);
    localStorage.setItem("lineUserId", registered.userId);

    spinnerEl.style.display = "none";
    msgEl.innerHTML = `
      <div class="success">✅ 連携完了！</div>
      <p style="margin-top:8px;font-size:13px;">毎朝7時に今日の予定と天気をLINEでお知らせします</p>
      <a href="${APP_URL}" class="line-btn">アプリを開く</a>
    `;

    // 3秒後に自動でアプリへ
    setTimeout(() => { location.href = APP_URL; }, 3000);

  } catch(err) {
    spinnerEl.style.display = "none";
    msgEl.innerHTML = `
      <div class="error">⚠️ エラーが発生しました</div>
      <p style="margin-top:8px;font-size:12px;color:#94a3b8;">${err.message}</p>
      <a href="${APP_URL}" class="line-btn" style="background:#2f7de1">アプリを開く</a>
    `;
  }
})();
</script>
</body>
</html>
